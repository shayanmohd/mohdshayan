        <section class="pb-10" aria-label="Password generator">
            <div class="max-w-content mx-auto px-6">
                <form class="tool-grid" id="pw-form" autocomplete="off" onsubmit="return false">
                    <div class="tool-aside lg:order-2">
                        <div class="bezel">
                            <div class="readout">
                                <p class="readout-label" id="pw-kind">Password</p>
                                <p class="secret mt-3 min-h-[2.2em]" id="pw-out" aria-label="Generated secret"></p>
                                <div class="meter" id="pw-meter" data-level="0" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
                                <p class="readout-sub" id="pw-strength"></p>
                                <div class="flex flex-wrap gap-2 mt-5">
                                    <button type="button" class="btn-invert btn-sm" id="pw-copy"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-copy"></use></svg> <span data-label>Copy</span></button>
                                    <button type="button" class="btn-ghost-dark" id="pw-new"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-arrows-clockwise"></use></svg> New one</button>
                                </div>
                            </div>
                        </div>
                        <p id="pw-live" class="sr-only" aria-live="polite"></p>
                    </div>

                    <div class="tool-panel tool-stack lg:order-1">
                        <div class="seg block" role="radiogroup" aria-label="Kind">
                            <label><input type="radio" name="kind" value="password" checked><span>Password</span></label>
                            <label><input type="radio" name="kind" value="passphrase"><span>Passphrase</span></label>
                            <label><input type="radio" name="kind" value="pin"><span>PIN</span></label>
                        </div>

                        <div data-kind="password" class="tool-stack">
                            <div class="field">
                                <label for="pw-length" class="field-label">Length <span class="hint"><output id="pw-length-out">20</output> characters</span></label>
                                <input type="range" class="range" id="pw-length" min="8" max="64" step="1" value="20">
                            </div>
                            <div class="grid sm:grid-cols-2 gap-3">
                                <label class="check"><input type="checkbox" id="pw-upper" checked> Capitals <span class="hint">A–Z</span></label>
                                <label class="check"><input type="checkbox" id="pw-lower" checked> Lower case <span class="hint">a–z</span></label>
                                <label class="check"><input type="checkbox" id="pw-digits" checked> Numbers <span class="hint">0–9</span></label>
                                <label class="check"><input type="checkbox" id="pw-symbols" checked> Symbols <span class="hint">!@#$%</span></label>
                            </div>
                            <label class="check"><input type="checkbox" id="pw-lookalike"> <span>Avoid look-alike characters<small>Leaves out I, l, 1, |, O, 0 and o, for passwords you have to read out or type by hand.</small></span></label>
                        </div>

                        <div data-kind="passphrase" class="tool-stack" hidden>
                            <div class="field">
                                <label for="pw-words" class="field-label">Words <span class="hint"><output id="pw-words-out">6</output> words</span></label>
                                <input type="range" class="range" id="pw-words" min="3" max="12" step="1" value="6">
                            </div>
                            <div class="field-row two">
                                <div class="field">
                                    <label for="pw-sep" class="field-label">Between words</label>
                                    <select id="pw-sep" class="input">
                                        <option value="-">Hyphen  a-b-c</option>
                                        <option value=" ">Space  a b c</option>
                                        <option value=".">Full stop  a.b.c</option>
                                        <option value="_">Underscore  a_b_c</option>
                                        <option value="">Nothing  abc</option>
                                    </select>
                                </div>
                                <div class="grid gap-3 content-end pb-1">
                                    <label class="check"><input type="checkbox" id="pw-cap"> Capitalise each word</label>
                                    <label class="check"><input type="checkbox" id="pw-num"> Add a number</label>
                                </div>
                            </div>
                            <p class="field-help">Words come from the EFF Long Wordlist (7,776 words, © Electronic Frontier Foundation, CC BY 3.0 US).</p>
                        </div>

                        <div data-kind="pin" class="tool-stack" hidden>
                            <div class="field">
                                <label for="pw-pin" class="field-label">Digits <span class="hint"><output id="pw-pin-out">6</output> digits</span></label>
                                <input type="range" class="range" id="pw-pin" min="4" max="12" step="1" value="6">
                            </div>
                            <p class="field-help">PINs are only safe where the number of attempts is limited, such as a phone or bank card.</p>
                        </div>

                        <p class="mono-meta text-muted flex items-start gap-2 pt-2"><svg class="icon mt-0.5 shrink-0" aria-hidden="true"><use href="/assets/icons.svg#i-shield-check"></use></svg> Generated on your device with the Web Crypto API. Never stored, logged or sent.</p>
                    </div>
                </form>
            </div>
        </section>
