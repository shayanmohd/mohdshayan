        <section class="pb-10" aria-label="Margin calculator">
            <div class="max-w-content mx-auto px-6">
                <form class="tool-grid" id="mg-form" autocomplete="off" onsubmit="return false">
                    <div class="tool-panel tool-stack">
                        <div class="tool-panel-head">
                            <h2 class="card-title">What do you know?</h2>
                            <div class="flex items-center gap-2">
                                <label for="mg-cur" class="hint">Currency</label>
                                <select id="mg-cur" class="input !h-9 !w-auto !text-[0.8125rem] font-mono"></select>
                            </div>
                        </div>
                        <div class="seg block wrap-sm" role="radiogroup" aria-label="What you know">
                            <label><input type="radio" name="mode" value="cost-price" checked><span>Cost and price</span></label>
                            <label><input type="radio" name="mode" value="cost-margin"><span>Cost and margin</span></label>
                            <label><input type="radio" name="mode" value="cost-markup"><span>Cost and markup</span></label>
                            <label><input type="radio" name="mode" value="price-margin"><span>Price and margin</span></label>
                        </div>
                        <div class="field-row two">
                            <div class="field">
                                <label for="mg-a" class="field-label" id="mg-a-label">Cost per unit</label>
                                <span class="affix"><span class="affix-text pre" data-cur-symbol>₹</span><input id="mg-a" class="input" inputmode="decimal"></span>
                            </div>
                            <div class="field">
                                <label for="mg-b" class="field-label" id="mg-b-label">Selling price</label>
                                <span class="affix" id="mg-b-wrap"><span class="affix-text pre" data-cur-symbol id="mg-b-pre">₹</span><input id="mg-b" class="input" inputmode="decimal"><span class="affix-text post" id="mg-b-post" hidden>%</span></span>
                            </div>
                        </div>
                        <div class="field-row two">
                            <div class="field">
                                <label for="mg-units" class="field-label">Units sold <span class="hint">optional</span></label>
                                <input id="mg-units" class="input" inputmode="numeric" placeholder="1">
                            </div>
                        </div>
                        <p class="field-error" id="mg-error" role="alert"></p>
                    </div>

                    <div class="tool-aside">
                        <div class="bezel">
                            <div class="readout" aria-live="polite">
                                <p class="readout-label" id="mg-head-label">Gross margin</p>
                                <p class="readout-value" id="mg-head">–</p>
                                <p class="readout-sub" id="mg-head-sub"></p>
                                <div class="split-bar" id="mg-split" role="img"><span style="background:#4b89e6"></span><span style="background:#b08a2e"></span></div>
                                <div class="legend" id="mg-legend"></div>
                                <dl class="readout-rows" id="mg-rows"></dl>
                                <div class="flex flex-wrap gap-2 mt-5">
                                    <button type="button" class="btn-ghost-dark" id="mg-copy"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-copy"></use></svg> <span data-label>Copy summary</span></button>
                                    <button type="button" class="btn-ghost-dark" id="mg-share"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-link"></use></svg> <span data-label>Copy link</span></button>
                                </div>
                            </div>
                        </div>
                        <p id="mg-live" class="sr-only" aria-live="polite"></p>
                    </div>
                </form>
            </div>
        </section>

        <section class="pb-6">
            <div class="max-w-content mx-auto px-6">
                <hr class="section-rule">
                <div class="grid lg:grid-cols-[1fr_2fr] gap-8 lg:gap-14 mt-10">
                    <div>
                        <h2 class="h3-serif" style="font-weight:500;">Margin is not markup</h2>
                        <p class="text-body text-[0.9375rem] leading-relaxed mt-3 max-w-xs">The markup you need to add to cost for each margin you want to keep. Mixing the two up is the most common pricing mistake.</p>
                    </div>
                    <div class="tool-panel">
                        <div class="table-scroll !max-h-none !border-t-0">
                            <table class="data-table" id="mg-table">
                                <thead><tr><th scope="col">Target margin</th><th scope="col">Markup needed</th><th scope="col">Price for a cost of 100</th><th scope="col">Profit</th></tr></thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>
